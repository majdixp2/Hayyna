name: Diagnose offer (read-only)

on:
  push:
    branches: [diag]
  workflow_dispatch:
    inputs:
      title:
        description: "part of offer title"
        required: true
        default: "قهوة"

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      TITLE: ${{ github.event.inputs.title || 'قهوة' }}
    steps:
      - name: Read offer + merchant status + config (types only, no phone numbers)
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" >/dev/null 2>&1
          TOKEN=$(gcloud auth print-access-token)
          B="https://firestore.googleapis.com/v1/projects/gen-lang-client-0536850806/databases/ai-studio-android-307cc811-cd30-4d36-b6c1-76e9fb2ac335/documents"
          curl -s -H "Authorization: Bearer $TOKEN" "$B/offers?pageSize=300" > offers.json
          curl -s -H "Authorization: Bearer $TOKEN" "$B/config/app" > config.json
          python3 - <<'PY' > ids.txt
          import json, os
          d = json.load(open("offers.json"))
          t = os.environ["TITLE"]
          def short(v):
              k = list(v.keys())[0]; x = v[k]
              if k == "stringValue": return f"string(len={len(x)})" + (f"='{x}'" if len(x) < 40 and not any(c.isdigit() for c in x[-4:]) else "")
              if k == "mapValue": return "map{" + ", ".join(f"{a}:{short(b)}" for a, b in x.get("fields", {}).items()) + "}"
              if k == "arrayValue": return f"array(len={len(x.get('values', []))})" + (" first=" + short(x["values"][0]) if x.get("values") else "")
              return f"{k}={x}"
          for doc in d.get("documents", []):
              f = doc["fields"]
              if t not in f.get("offerTitle", {}).get("stringValue", ""): continue
              print("::notice title=offer " + doc["name"].split("/")[-1] + "::" + " | ".join(f"{k}: {short(v)}" for k, v in sorted(f.items()) if k not in ("phone",)))
              print("MID " + f.get("merchantId", {}).get("stringValue", ""))
          PY
          grep -v '^MID' ids.txt
          for m in $(grep '^MID' ids.txt | cut -d' ' -f2 | sort -u); do
            S=$(curl -s -H "Authorization: Bearer $TOKEN" "$B/merchantStatus/$m" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(json.dumps(d.get("fields",d.get("error",{}).get("status","none"))))')
            echo "::notice title=merchantStatus $m::$S"
          done
          python3 -c 'import json; f=json.load(open("config.json"))["fields"]; print("::notice title=config exclusive::"+json.dumps(f.get("exclusive",{}))[:900]); print("::notice title=config catalog.features::"+json.dumps(f.get("catalog",{}).get("mapValue",{}).get("fields",{}).get("features",{}))[:900])'
