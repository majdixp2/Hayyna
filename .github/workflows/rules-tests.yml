name: Firestore rules tests
on:
  push:
    paths: ["firestore.rules", "tests/rules/**", ".github/workflows/rules-tests.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Install
        working-directory: tests/rules
        run: |
          npm install --no-audit --no-fund > install.log 2>&1 || { tail -15 install.log | sed 's/^/::error title=install::/'; exit 1; }
      - name: Run rules tests on the emulator
        working-directory: tests/rules
        run: |
          set -o pipefail
          cp ../../firestore.rules ./firestore.rules
          npx firebase emulators:exec --only firestore --project demo-hayyna "node repro.test.mjs" 2>&1 | tee run.log; grep -vE "^\s+at |^\s*$" firestore-debug.log | grep -iE "exception|error|denied|limit|undefined" | sort -u | head -20 | sed "s/^/::warning title=dbg::/" || {
            grep -vE '^::' run.log | grep -iE 'error|fail|✘|exception' | head -20 | sed 's/^/::error title=emulator::/'; tail -8 run.log | sed 's/^/::warning title=tail::/'; exit 1; }
