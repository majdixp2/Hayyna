name: Firestore rules tests
on:
  push:
    paths: ["firestore.rules", "tests/rules/**", ".github/workflows/rules-tests.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Install
        working-directory: tests/rules
        run: npm install --no-audit --no-fund
      - name: Run rules tests on the emulator
        working-directory: tests/rules
        run: npx firebase emulators:exec --only firestore --project demo-hayyna "node credits.test.mjs"
