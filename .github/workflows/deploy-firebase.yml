name: Deploy web + Firestore rules

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secret
        id: check
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is missing — skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 20
      - name: Deploy hosting
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@14 deploy --only hosting --project gen-lang-client-0536850806 --non-interactive 2>&1 | tee hosting.txt
          grep -iE "Hosting URL" hosting.txt | sed 's/^/::notice::/' || true
      - name: Deploy Firestore rules
        if: steps.check.outputs.skip != 'true'
        run: |
          # ننشر القواعد مباشرة عبر Firebase Rules API لقاعدة البيانات المسمّاة
          # (firebase deploy كان يقول "complete" بدون ما ينشر شي لهالقاعدة)
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" >/dev/null 2>&1
          TOKEN=$(gcloud auth print-access-token)
          P=gen-lang-client-0536850806
          DB=ai-studio-android-307cc811-cd30-4d36-b6c1-76e9fb2ac335
          BODY=$(python3 -c 'import json; print(json.dumps({"source":{"files":[{"name":"firestore.rules","content":open("firestore.rules").read()}]}}))')
          RS=$(curl -s -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$BODY" "https://firebaserules.googleapis.com/v1/projects/$P/rulesets")
          NAME=$(echo "$RS" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("name",""))')
          if [ -z "$NAME" ]; then
            echo "$RS" | python3 -c 'import sys,json; d=json.load(sys.stdin).get("error",{}); print(d.get("message","")); [print(x) for x in [str(i) for i in d.get("details",[])][:5]]' | sed 's/^/::error title=rules compile::/'
            exit 1
          fi
          REL=$(curl -s -X PATCH -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"release\":{\"name\":\"projects/$P/releases/cloud.firestore/$DB\",\"rulesetName\":\"$NAME\"}}" \
            "https://firebaserules.googleapis.com/v1/projects/$P/releases/cloud.firestore/$DB")
          echo "$REL" | python3 -c 'import sys,json; d=json.load(sys.stdin); e=d.get("error"); print(("::error title=rules release::"+e.get("message","")) if e else ("::notice title=rules released::"+d.get("rulesetName","")+" "+d.get("updateTime","")))'
          echo "$REL" | grep -q '"error"' && exit 1 || true
      - name: Verify live rules
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" >/dev/null 2>&1
          TOKEN=$(gcloud auth print-access-token)
          P=gen-lang-client-0536850806
          DB=ai-studio-android-307cc811-cd30-4d36-b6c1-76e9fb2ac335
          for REL in "cloud.firestore/$DB" "cloud.firestore"; do
            R=$(curl -s -H "Authorization: Bearer $TOKEN" "https://firebaserules.googleapis.com/v1/projects/$P/releases/$REL")
            NAME=$(echo "$R" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("rulesetName",""), d.get("updateTime",""), d.get("error",{}).get("message",""))')
            RS=$(echo "$NAME" | cut -d' ' -f1)
            HAS="-"
            if [ -n "$RS" ] && [ "${RS#projects}" != "$RS" ]; then
              SRC=$(curl -s -H "Authorization: Bearer $TOKEN" "https://firebaserules.googleapis.com/v1/$RS")
              HAS=$(echo "$SRC" | python3 -c 'import sys,json; d=json.load(sys.stdin); t=" ".join(f.get("content","") for f in d.get("source",{}).get("files",[])); print("creditCodes:"+str("creditCodes" in t)+" staff:"+str("match /staff/" in t))')
            fi
            echo "::notice title=live rules $REL::$NAME | $HAS"
          done
          echo "::notice title=repo rules::$(sha1sum firestore.rules | cut -c1-10)"
