<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة إدارة حيّنا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">حيّنا</span><span class="sub">لوحة الإدارة</span></div>
    <div id="user" class="user"></div>
  </header>

  <main id="login" class="center hidden">
    <div class="card login-card">
      <h1>لوحة إدارة حيّنا</h1>
      <p>سجّل دخول بحساب الأدمن</p>
      <button id="loginBtn" class="btn primary big">الدخول بحساب Google</button>
      <p id="loginError" class="error"></p>
    </div>
  </main>

  <main id="app" class="hidden">
    <nav id="tabs" class="tabs"></nav>
    <section id="content" class="content"></section>
  </main>

  <div id="viewer" class="viewer hidden"><img id="viewerImg" alt=""><button class="close" id="viewerClose">✕</button></div>
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
