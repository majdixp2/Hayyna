<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>حيّنا — عروض المحلات حولك على الخريطة</title>
  <meta name="description" content="شوف عروض وخصومات المحلات في حيّك على الخريطة: مطاعم، مقاهي، ملابس، جوالات وأكثر.">
  <meta name="theme-color" content="#2D6A4F">
  <meta property="og:title" content="حيّنا — عروض المحلات حولك">
  <meta property="og:description" content="عروض وخصومات المحلات في حيّك على الخريطة 📍">
  <meta property="og:image" content="/img/icon-512.png">
  <meta property="og:type" content="website">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/icon-192.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="حيّنا">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="map" dir="ltr" aria-label="خريطة العروض"></div>

  <!-- البحث والتصنيفات -->
  <header class="top">
    <div class="searchbar">
      <img src="/img/icon-192.png" alt="حيّنا" class="brand">
      <input id="q" type="search" placeholder="ابحث: شاورما، قهوة، جوالات، اسم حي…" autocomplete="off" enterkeyhint="search">
      <button id="clearQ" class="icon-btn hidden" aria-label="مسح">✕</button>
    </div>
    <div id="chips" class="chips"></div>
  </header>

  <button id="locate" class="fab" aria-label="موقعي">◎</button>

  <!-- العروض أسفل الشاشة -->
  <section id="carousel" class="carousel" aria-label="العروض"></section>
  <div id="empty" class="empty hidden"></div>

  <!-- لوحة التفاصيل (عرض أو متجر) -->
  <div id="sheetBackdrop" class="backdrop hidden"></div>
  <article id="sheet" class="sheet hidden" aria-modal="true" role="dialog">
    <button id="sheetClose" class="sheet-close" aria-label="إغلاق">✕</button>
    <div id="sheetBody" class="sheet-body"></div>
  </article>

  <!-- عارض الصور -->
  <div id="viewer" class="viewer hidden"><img id="viewerImg" alt=""><button id="viewerClose" class="viewer-close" aria-label="إغلاق">✕</button></div>

  <!-- إضافة للشاشة الرئيسية (آيفون) -->
  <div id="installTip" class="install hidden">
    <img src="/img/icon-192.png" alt="">
    <div><b>ثبّت حيّنا على جوالك</b><br>اضغط <span class="share-ico">⬆︎</span> مشاركة، ثم «إضافة إلى الشاشة الرئيسية»</div>
    <button id="installClose" class="icon-btn" aria-label="إغلاق">✕</button>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
