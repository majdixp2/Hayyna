<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة إدارة لكوفر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/style.css?v=4">
</head>
<body>
  <main id="login" class="center hidden">
    <div class="card login-card">
      <svg class="login-logo" width="56" height="67" viewBox="0 0 100 120" aria-hidden="true"><circle cx="50" cy="50" r="50" fill="#1A73E8"/><path d="M27 86 L50 120 L73 86 Z" fill="#1A73E8"/><circle cx="50" cy="50" r="33" fill="#fff"/><path d="M77.4 64.6 L80.7 82.9 L69.1 74.4 Z" fill="#fff"/><circle cx="38" cy="40" r="7" fill="#EA4335"/><circle cx="62" cy="62" r="7" fill="#34A853"/><path d="M64 34 L36 68" stroke="#FBBC04" stroke-width="8" stroke-linecap="round"/></svg>
      <h1>لوحة إدارة لكوفر</h1>
      <p class="muted">سجّل دخول بحساب الأدمن أو حساب الموظف</p>
      <button id="loginBtn" class="btn primary big">الدخول بحساب Google</button>
      <p id="loginError" class="error"></p>
    </div>
  </main>

  <div id="app" class="shell hidden">
    <aside class="side" aria-label="أقسام لوحة الإدارة">
      <div class="brand">
        <svg width="30" height="36" viewBox="0 0 100 120" aria-hidden="true"><circle cx="50" cy="50" r="50" fill="#1A73E8"/><path d="M27 86 L50 120 L73 86 Z" fill="#1A73E8"/><circle cx="50" cy="50" r="33" fill="#fff"/><path d="M77.4 64.6 L80.7 82.9 L69.1 74.4 Z" fill="#fff"/><circle cx="38" cy="40" r="7" fill="#EA4335"/><circle cx="62" cy="62" r="7" fill="#34A853"/><path d="M64 34 L36 68" stroke="#FBBC04" stroke-width="8" stroke-linecap="round"/></svg>
        <div><div class="logo">LACOVER</div><div class="sub">لوحة الإدارة</div></div>
      </div>
      <nav id="tabs" class="nav"></nav>
      <div id="user" class="user"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <h1 id="pageTitle" class="page-title">الرئيسية</h1>
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </header>
      <section id="content" class="content"></section>
    </div>
  </div>

  <div id="viewer" class="viewer hidden"><img id="viewerImg" alt=""><button class="close" id="viewerClose" aria-label="إغلاق">✕</button></div>
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="/admin/app.js?v=4"></script>
</body>
</html>
